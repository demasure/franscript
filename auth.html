<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FranScript - Connexion</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background: var(--color-bg-main);
            overflow: hidden;
        }

        .auth-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* PARTIE GAUCHE - Image/Branding */
        .auth-left {
            flex: 1;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .auth-left::before {
            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .auth-branding {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        .auth-logo {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .auth-tagline {
            font-size: 1.5rem;
            opacity: 0.95;
            line-height: 1.6;
            max-width: 400px;
        }

        .auth-decorative-image {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: rgba(255,255,255,0.05);
            clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
        }

        /* PARTIE DROITE - Formulaires */
        .auth-right {
            flex: 1;
            background: var(--color-bg-card);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .auth-form-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-form-header {
            margin-bottom: 40px;
        }

        .auth-form-header h1 {
            color: var(--color-text-primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .auth-form-header p {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--color-bg-elevated);
            padding: 6px;
            border-radius: 12px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 85, 164, 0.3);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text-primary);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--color-bg-elevated);
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--color-text-primary);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: var(--color-bg-main);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--color-primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(0, 85, 164, 0.3);
        }

        .submit-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 85, 164, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .auth-container {
                flex-direction: column;
            }

            .auth-left {
                min-height: 30vh;
                padding: 40px 20px;
            }

            .auth-logo {
                font-size: 2.5rem;
            }

            .auth-tagline {
                font-size: 1.1rem;
            }

            .auth-right {
                padding: 40px 20px;
            }

            .auth-form-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- PARTIE GAUCHE - Image/Branding -->
        <div class="auth-left">
            <div class="auth-branding">
                <div class="auth-logo">FranScript</div>
                <div class="auth-tagline">
                    Apprenez le français à travers des vidéos authentiques avec sous-titres interactifs
                </div>
            </div>
            <div class="auth-decorative-image"></div>
        </div>

        <!-- PARTIE DROITE - Formulaires -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-form-header">
                    <h1>Bienvenue</h1>
                    <p>Connectez-vous pour continuer</p>
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">Connexion</button>
                    <button class="auth-tab" onclick="switchTab('register')">Inscription</button>
                </div>

                <!-- Formulaire de Connexion -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Mot de passe</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Se connecter</button>
                    <div class="form-footer">
                        Pas encore de compte ? <a href="#" onclick="switchTab('register'); return false;" style="color: var(--color-primary);">S'inscrire</a>
                    </div>
                </form>

                <!-- Formulaire d'Inscription -->
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="register-username">Pseudo</label>
                        <input type="text" id="register-username" placeholder="VotrePseudo" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
                        <small style="color: var(--color-text-secondary); font-size: 0.85rem; margin-top: 4px; display: block;">3-20 caractères, lettres, chiffres et underscores uniquement</small>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Mot de passe</label>
                        <input type="password" id="register-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">Confirmer le mot de passe</label>
                        <input type="password" id="register-confirm" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Créer un compte</button>
                    <div class="form-footer">
                        Déjà un compte ? <a href="#" onclick="switchTab('login'); return false;" style="color: var(--color-primary);">Se connecter</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';

        // Switcher entre onglets
        function switchTab(tab) {
            // Mettre à jour les boutons
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Mettre à jour les formulaires
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(`${tab}-form`).classList.add('active');
        }

        // Gestion de la connexion
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification('Connexion réussie ! Redirection...', 'success');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    showNotification(data.error || 'Erreur de connexion', 'error');
                }
            } catch (error) {
                showNotification('Erreur de connexion au serveur', 'error');
            }
        });

        // Gestion de l'inscription
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('register-email').value;
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            if (password !== confirm) {
                showNotification('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification('Compte créé avec succès ! Redirection...', 'success');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    showNotification(data.error || 'Erreur lors de l\'inscription', 'error');
                }
            } catch (error) {
                showNotification('Erreur de connexion au serveur', 'error');
            }
        });
    </script>
</body>
</html>

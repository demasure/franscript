<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>FranScript - Vidéos avec Sous-titres Interactifs</title>

    <!-- Protection: Redirection vers auth si non connecté -->
    <script src="authGuard.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <!-- HEADER - Navigation principale -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <!-- Logo / Nom du site -->
                <a href="index.html" class="logo">
                    <img src="images/logo.png" alt="FranScript" class="logo-icon">
                    <span class="logo-text">FranScript</span>
                </a>

                <!-- Navigation -->
                <nav class="nav">
                    <button id="idea-btn" class="btn-idea">💡 J'ai une idée pour le site</button>
                </nav>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="container">

            <!-- FILTERS SECTION - Filtres par catégorie -->
            <section class="filters" id="videos">
                <h2 class="section-title">Parcourir les vidéos</h2>

                <!-- Filtres par catégorie -->
                <div class="filter-group">
                    <h3 class="filter-group-title">Catégories</h3>
                    <div class="filter-buttons category-filters">
                        <button class="filter-btn active" data-category="all">Toutes</button>
                        <!-- Les tags sont chargés dynamiquement depuis la base de données -->
                    </div>
                </div>
            </section>

            <!-- VIDEO GRID - Grille de vidéos (remplie dynamiquement par script.js) -->
            <section class="video-grid">
                <!-- Les vidéos sont chargées dynamiquement depuis la base de données -->
            </section>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2024 FranScript - Tous droits réservés</p>
                <div class="footer-links">
                    <a href="#privacy">Confidentialité</a>
                    <a href="#terms">Conditions d'utilisation</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- POPUP IDÉE -->
    <div id="idea-popup" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💡 Partagez votre idée</h2>
                <button class="modal-close" id="close-idea-popup">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-description">Vous avez une idée pour améliorer FranScript ? Partagez-la avec nous !</p>
                <form id="idea-form">
                    <div class="form-group">
                        <label for="idea-title">Titre de l'idée</label>
                        <input
                            type="text"
                            id="idea-title"
                            class="form-input"
                            placeholder="Ex: Ajouter des exercices de prononciation"
                            maxlength="100"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="idea-description">Description</label>
                        <textarea
                            id="idea-description"
                            class="form-textarea"
                            placeholder="Décrivez votre idée en détail..."
                            maxlength="500"
                            rows="6"
                            required
                        ></textarea>
                        <div class="char-counter">
                            <span id="idea-char-count">0</span> / 500 caractères
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="cancel-idea">Annuler</button>
                        <button type="submit" class="btn-primary">Envoyer l'idée</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="navbar.js?v=2.0"></script>
    <script src="utils.js?v=2.0"></script>
    <script src="script.js?v=2.0"></script>
</body>
</html>

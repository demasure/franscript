<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saison | FranScript</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .breadcrumb {
            padding: 1rem 0;
            color: #666;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .saison-header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            border-radius: 12px;
        }

        .saison-header h1 {
            margin: 0 0 1rem 0;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .episode-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .episode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .episode-card.locked {
            opacity: 0.7;
        }

        .episode-thumbnail {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .episode-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .episode-number-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
        }

        .episode-duration {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .episode-card-body {
            padding: 1.5rem;
        }

        .episode-card-body h3 {
            margin: 0 0 0.5rem 0;
            color: #2c3e50;
        }

        .premium-badge {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.85rem;
            margin-left: 0.5rem;
        }

        .back-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 2rem;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container" style="padding-top: 80px;">
        <div class="breadcrumb">
            <a href="index.html">Sagas</a> &gt;
            <a href="#" id="saga-link">Saga</a> &gt;
            <span id="saison-breadcrumb">Saison</span>
        </div>

        <div class="saison-header">
            <h1 id="saison-title">Chargement...</h1>
            <span id="saison-premium-badge"></span>
            <p id="saison-description" style="margin-top: 1rem; opacity: 0.9;"></p>
        </div>

        <h2>Épisodes</h2>
        <div class="episodes-grid" id="episodes-grid">
            <!-- Chargé dynamiquement -->
        </div>
    </main>

    <script src="navbar.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000';
        let currentUser = { isPremium: false, isAdmin: false, isLoggedIn: false };
        let currentSaga = null;

        // Récupérer l'ID de la saison depuis l'URL
        const params = new URLSearchParams(window.location.search);
        const saisonId = params.get('id');

        if (!saisonId) {
            document.body.innerHTML = '<div class="container"><h1>Saison introuvable</h1></div>';
        }

        // Récupérer le statut utilisateur
        async function getUserStatus() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    const user = data.user;
                    currentUser = {
                        isPremium: user.is_premium === 1,
                        isAdmin: user.role === 'admin',
                        isLoggedIn: true
                    };
                }
            } catch (error) {
                console.error('Erreur récupération statut:', error);
            }
        }

        // Charger la saison et ses épisodes
        async function loadSaison() {
            try {
                const response = await fetch(`${API_BASE}/api/saisons/${saisonId}`);

                if (!response.ok) {
                    throw new Error('Saison introuvable');
                }

                const data = await response.json();
                const { saison, saga, episodes } = data;

                currentSaga = saga;

                // Mettre à jour le breadcrumb
                document.getElementById('saga-link').textContent = saga.title;
                document.getElementById('saga-link').href = `saga.html?id=${saga.id}`;
                document.getElementById('saison-breadcrumb').textContent = saison.title;

                // Afficher les informations de la saison
                document.getElementById('saison-title').textContent = saison.title;
                document.getElementById('saison-description').textContent = saison.description || '';

                const isPremium = saison.is_premium || saga.is_premium;
                if (isPremium && !currentUser.isPremium && !currentUser.isAdmin) {
                    document.getElementById('saison-premium-badge').innerHTML = '<span class="premium-badge">👑 Premium</span>';
                }

                // Afficher les épisodes
                renderEpisodes(episodes, isPremium);

            } catch (error) {
                console.error('Erreur:', error);
                document.body.innerHTML = '<div class="container"><h1>Erreur lors du chargement</h1></div>';
            }
        }

        function renderEpisodes(episodes, saisonPremium) {
            const grid = document.getElementById('episodes-grid');

            if (episodes.length === 0) {
                grid.innerHTML = '<p>Aucun épisode disponible.</p>';
                return;
            }

            grid.innerHTML = episodes.map(episode => {
                const isPremium = episode.is_premium || saisonPremium;
                const canAccess = !isPremium || currentUser.isPremium || currentUser.isAdmin;

                const thumbnail = episode.thumbnail_url
                    ? `<img src="${episode.thumbnail_url}" alt="${episode.title}">`
                    : '<div style="font-size: 3rem;">🎬</div>';

                return `
                    <div class="episode-card ${!canAccess ? 'locked' : ''}" onclick="playEpisode(${episode.id}, ${canAccess})">
                        <div class="episode-thumbnail">
                            ${thumbnail}
                            <span class="episode-number-badge">Ép. ${episode.episode_number}</span>
                            ${episode.duration ? `<span class="episode-duration">${formatDuration(episode.duration)}</span>` : ''}
                            ${!canAccess ? '<div class="episode-lock-overlay">🔒</div>' : ''}
                        </div>
                        <div class="episode-card-body">
                            <h3>${episode.title}</h3>
                            ${isPremium && !canAccess ? '<span class="premium-badge">👑 Premium</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function playEpisode(episodeId, canAccess) {
            if (!canAccess) {
                alert('🔒 Cet épisode est réservé aux membres Premium\n\nPassez à Premium pour accéder à tout le contenu exclusif !');
                return;
            }

            // Récupérer les détails de l'épisode
            try {
                const response = await fetch(`${API_BASE}/api/episodes/${episodeId}`);
                const data = await response.json();

                if (!data.access.allowed) {
                    alert(data.access.reason || 'Accès refusé');
                    return;
                }

                const episode = data.episode;

                // Rediriger vers le player
                const url = `player.html?video=${encodeURIComponent(episode.video_url)}&subtitle=${encodeURIComponent(episode.subtitle_url || '')}&title=${encodeURIComponent(episode.title)}&id=${episodeId}`;
                window.location.href = url;

            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de la lecture de l\'épisode');
            }
        }

        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', async () => {
            await getUserStatus();
            await loadSaison();
        });
    </script>
</body>
</html>
